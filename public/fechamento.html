<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechamento do Dia — Panela da Roça</title>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;510;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(15% 0.02 40); --surface: oklch(22% 0.025 40); --fg: oklch(95% 0.01 60);
      --muted: oklch(65% 0.02 50); --border: oklch(35% 0.03 45); --accent: oklch(62% 0.14 45);
      --verde: oklch(55% 0.10 140); --vermelho: oklch(48% 0.16 28);
      --font-body: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--fg); min-height: 100vh; padding-bottom: 80px; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .page-title { font-size: 18px; font-weight: 600; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-input { width: 100%; height: 44px; padding: 0 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font-family: var(--font-body); font-size: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-primary { width: 100%; height: 48px; background: var(--accent); color: var(--bg); border: none; border-radius: 10px; font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary:active { transform: scale(0.98); }

    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; text-decoration: none; color: var(--muted); font-size: 10px; font-weight: 510; }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 20px; }
  </style>
</head>
<body>
  <header class="header"><span class="page-title">Fechamento do Dia</span></header>
  <main class="main">
    <div class="section">
      <div class="section-title">Vendas do dia</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Dinheiro</label><input class="form-input" id="vDinheiro" inputmode="decimal" oninput="calcCaixa()"></div>
        <div class="form-group"><label class="form-label">Cartão Crédito</label><input class="form-input" id="vCredito" inputmode="decimal"></div>
        <div class="form-group"><label class="form-label">Cartão Débito</label><input class="form-input" id="vDebito" inputmode="decimal"></div>
        <div class="form-group"><label class="form-label">PIX</label><input class="form-input" id="vPix" inputmode="decimal"></div>
        <div class="form-group"><label class="form-label">Vale Refeição</label><input class="form-input" id="vVale" inputmode="decimal"></div>
        <div class="form-group"><label class="form-label">Delivery</label><input class="form-input" id="vDelivery" inputmode="decimal"></div>
      </div>
    </div>

    <div class="section" id="sec-despesas">
      <div class="section-title">Despesas do dia (saíram do caixa)</div>
      <div id="despesas-lista" style="font-size:13px;color:var(--muted);">Calculando...</div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:14px;font-weight:600;">Total que saiu do caixa</span>
        <span id="total-saidas" class="form-label" style="font-size:16px;color:var(--accent);font-family:var(--font-mono);">R$ 0,00</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Conferência do caixa</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Fundo de caixa (início)</label><input class="form-input" id="fundoCaixa" inputmode="decimal" value="0" oninput="calcCaixa()"></div>
        <div class="form-group"><label class="form-label">Dinheiro contado (na gaveta)</label><input class="form-input" id="caixaContado" inputmode="decimal" oninput="calcCaixa()"></div>
      </div>
      <div id="caixa-feedback" style="display:none;margin-top:12px;padding:14px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;"></div>
      <div id="caixa-detalhe" style="display:none;margin-top:8px;font-size:12px;color:var(--muted);text-align:center;"></div>
    </div>

    <div class="section">
      <div class="section-title">Operacionais</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Clientes Atendidos</label><input class="form-input" id="clientes" inputmode="numeric"></div>
        <div class="form-group"><label class="form-label">KG Self-Service</label><input class="form-input" id="kgSS" inputmode="decimal"></div>
        <div class="form-group"><label class="form-label">KG Carnes Churrasco</label><input class="form-input" id="kgCarne" inputmode="decimal"></div>
      </div>
    </div>
    <button class="btn-primary" onclick="fecharDia()" id="btnFechar">Fechar o Dia</button>
    <div id="resultado" style="display:none;margin-top:16px;" class="section"><div class="section-title" id="resultadoText"></div></div>
  </main>
  <script src="auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('not auth')

    let saidasCaixa = 0

    async function carregarDespesas() {
      const data = new Date().toISOString().slice(0,10)
      const res = await apiGet('/api/fechamento-dia/preview?data=' + data)
      if (!res) return
      const lista = res.despesas_caixa_lista || []
      saidasCaixa = Math.round((res.saidas_caixa || 0) * 100) / 100
      const el = document.getElementById('despesas-lista')
      if (lista.length === 0) {
        el.innerHTML = '<div style="padding:6px 0;">Nenhuma despesa retirada do caixa hoje.</div>'
      } else {
        el.innerHTML = lista.map(l => '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>' + (l.descricao || 'Despesa') + '</span><span style="font-family:var(--font-mono);">− ' + formatCurrency(l.valor) + '</span></div>').join('')
      }
      document.getElementById('total-saidas').textContent = formatCurrency(saidasCaixa)
      if (res.ja_fechado && res.fechamento) {
        const f = res.fechamento
        fill(f.vendas_dinheiro, 'vDinheiro'); fill(f.vendas_cartao_credito, 'vCredito'); fill(f.vendas_cartao_debito, 'vDebito'); fill(f.vendas_pix, 'vPix'); fill(f.vendas_vale_refeicao, 'vVale'); fill(f.vendas_delivery, 'vDelivery'); fill(f.fundo_caixa, 'fundoCaixa');
        document.getElementById('resultadoText').textContent = 'Dia ' + data + ' já fechado. Refeche se quiser atualizar os valores.'
        document.getElementById('resultado').style.display = 'block'
        document.getElementById('btnFechar').textContent = 'Atualizar Fechamento'
      }
      calcCaixa()
    }

    function fill(v, id) { if (v != null && v != 0) document.getElementById(id).value = v }

    function num(id) {
      const raw = document.getElementById(id).value || '0'
      return parseFloat(raw.replace(',', '.')) || 0
    }

    function calcCaixa() {
      const dinheiro = num('vDinheiro')
      const fundo = num('fundoCaixa')
      const contado = document.getElementById('caixaContado').value.trim()
      if (contado === '') { hideFeedback(); return }
      const contadoVal = parseFloat(contado.replace(',', '.')) || 0
      const esperado = fundo + dinheiro - saidasCaixa
      const dif = Math.round((contadoVal - esperado) * 100) / 100

      const fb = document.getElementById('caixa-feedback')
      const det = document.getElementById('caixa-detalhe')
      fb.style.display = 'block'; det.style.display = 'block'

      if (Math.abs(dif) < 0.01) {
        fb.style.background = 'oklch(30% 0.10 140)'; fb.style.color = 'var(--verde-pago)'
        fb.textContent = '✔️ Bateu certinho!'
      } else if (dif < 0) {
        fb.style.background = 'oklch(32% 0.12 32)'; fb.style.color = 'var(--vermelho-atrasado)'
        fb.textContent = '⚠️ Faltam ' + formatCurrency(Math.abs(dif)) + ' no caixa'
      } else {
        fb.style.background = 'oklch(32% 0.09 80)'; fb.style.color = 'oklch(80% 0.12 80)'
        fb.textContent = '🟡 Sobrou ' + formatCurrency(dif) + ' no caixa'
      }
      det.innerHTML = 'Esperado: ' + formatCurrency(esperado) + ' (fundo ' + formatCurrency(fundo) + ' + dinheiro ' + formatCurrency(dinheiro) + ' − saídas ' + formatCurrency(saidasCaixa) + ')'
    }

    function hideFeedback() {
      document.getElementById('caixa-feedback').style.display = 'none'
      document.getElementById('caixa-detalhe').style.display = 'none'
    }

    async function fecharDia() {
      const data = {
        data: new Date().toISOString().slice(0,10),
        vendas_dinheiro: num('vDinheiro'),
        vendas_cartao_credito: num('vCredito'),
        vendas_cartao_debito: num('vDebito'),
        vendas_pix: num('vPix'),
        vendas_vale_refeicao: num('vVale'),
        vendas_delivery: num('vDelivery'),
        fundo_caixa: num('fundoCaixa'),
        caixa_contado: num('caixaContado'),
        clientes_atendidos: document.getElementById('clientes').value,
        kg_self_service: document.getElementById('kgSS').value.replace(',','.'),
        kg_carnes_churrasco: document.getElementById('kgCarne').value.replace(',','.')
      }
      const btn = document.getElementById('btnFechar')
      btn.disabled = true; btn.textContent = 'Fechando...'
      const res = await apiPost('/api/fechamento-dia', data)
      btn.disabled = false; btn.textContent = data.caixa_contado ? 'Atualizar Fechamento' : 'Fechar o Dia'
      const el = document.getElementById('resultado')
      el.style.display = 'block'
      if (res) {
        let msg = '✅ Dia fechado! Total: ' + formatCurrency(res.total_vendas)
        msg += ' | Lucro: ' + formatCurrency(res.lucro_bruto)
        if (res.saidas_caixa != null) msg += ' | Saíram do caixa: ' + formatCurrency(res.saidas_caixa)
        if (res.diferenca_caixa != null) {
          const dif = res.diferenca_caixa
          if (Math.abs(dif) < 0.01) msg += ' | ✔️ Caixa bateu!'
          else if (dif < 0) msg += ' | ⚠️ Faltam ' + formatCurrency(Math.abs(dif))
          else msg += ' | 🟡 Sobrou ' + formatCurrency(dif)
        }
        document.getElementById('resultadoText').textContent = msg
      } else {
        document.getElementById('resultadoText').textContent = '❌ Erro ao fechar dia'
      }
    }

    carregarDespesas()
  </script>
  <nav class="tab-bar">
    <a href="/dashboard" class="tab-item"><div class="tab-icon">🏠</div><span>Dashboard</span></a>
    <a href="/fechamento" class="tab-item"><div class="tab-icon">📊</div><span>Fechamento</span></a>
    <a href="/churrasco" class="tab-item"><div class="tab-icon">🥩</div><span>Churrasco</span></a>
    <a href="/lancamentos" class="tab-item"><div class="tab-icon">📋</div><span>Lançamentos</span></a>
    <a href="/contas-a-pagar" class="tab-item"><div class="tab-icon">📅</div><span>A Pagar</span></a>
  </nav>
</body>
</html>
