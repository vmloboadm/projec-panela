<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Contas — Panela da Roça</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;510;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      oklch(15% 0.02 40);
      --surface: oklch(22% 0.025 40);
      --fg:      oklch(95% 0.01 60);
      --muted:   oklch(65% 0.02 50);
      --border:  oklch(35% 0.03 45);
      --accent:  oklch(62% 0.14 45);
      --red-tijolo: oklch(48% 0.16 28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-back {
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-small img { height: 32px; }

    .user-menu {
      width: 36px;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .main-content {
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .conta-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .conta-icon {
      width: 44px;
      height: 44px;
      background: var(--bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .conta-icon svg {
      width: 22px;
      height: 22px;
      color: var(--accent);
    }

    .conta-info {
      flex: 1;
      min-width: 0;
    }

    .conta-nome {
      font-size: 15px;
      font-weight: 510;
      margin-bottom: 4px;
    }

    .conta-tipo {
      font-size: 13px;
      color: var(--muted);
      text-transform: capitalize;
    }

    .conta-saldo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 510;
    }

    .conta-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover { background: var(--bg); }

    .btn-icon.danger { border-color: var(--red-tijolo); color: var(--red-tijolo); }

    .fab {
      position: fixed;
      bottom: 92px;
      right: 20px;
      width: 56px;
      height: 56px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: var(--bg);
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px oklch(from var(--accent) l c h / 0.3);
      z-index: 10;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .tab-item.active { color: var(--accent); }

    .tab-icon {
      width: 24px;
      height: 24px;
    }

    .tab-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(0% 0 0 / 0.6);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 24px 20px 32px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 510;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-input,
    .form-select {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%239a8a7a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
    }

    .form-input:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px oklch(62% 0.14 45 / 0.15);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-primary {
      flex: 1;
      height: 48px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      flex: 1;
      height: 48px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 510;
      cursor: pointer;
    }

    .btn-secondary:hover { background: var(--bg); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <header class="header">
    <button class="btn-back" onclick="window.location.href='/configuracoes'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="logo-small">
      <img src="logo-panela-png.png" alt="Panela da Roça">
    </div>
    <div class="user-menu" id="userMenu"></div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Gerenciar Contas</h1>
    <div id="contas-list"></div>
  </main>

  <button class="fab" id="fabAdd">+</button>


  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Nova Conta</div>
      <input type="hidden" id="contaId">
      <div class="form-group">
        <label class="form-label">Nome</label>
        <input type="text" class="form-input" id="contaNome" placeholder="Ex: Caixa, Nubank...">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="contaTipo">
          <option value="dinheiro">Dinheiro</option>
          <option value="banco">Banco</option>
          <option value="pix">Pix</option>
          <option value="cartao">Cartão</option>
          <option value="investimento">Investimento</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Saldo Inicial</label>
        <input type="number" class="form-input" id="contaSaldo" placeholder="0.00" step="0.01">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancel">Cancelar</button>
        <button class="btn-primary" id="btnSave">Salvar</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Não autenticado');

    const listEl = document.getElementById('contas-list');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const contaIdInput = document.getElementById('contaId');
    const contaNome = document.getElementById('contaNome');
    const contaTipo = document.getElementById('contaTipo');
    const contaSaldo = document.getElementById('contaSaldo');

    const user = getUser();
    if (user) document.getElementById('userMenu').textContent = (user.nome || 'U').slice(0, 2).toUpperCase();

    document.getElementById('userMenu').addEventListener('click', logout);

    const ICONS = {
      dinheiro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9z"/><path d="M22 9V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2"/></svg>',
      banco: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
      pix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M6 12h12"/></svg>',
      cartao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>',
      investimento: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      outro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>'
    };

    function renderCard(c) {
      const icon = ICONS[c.tipo] || ICONS.outro;
      return `<div class="conta-card">
        <div class="conta-icon">${icon}</div>
        <div class="conta-info">
          <div class="conta-nome">${c.nome}</div>
          <div class="conta-tipo">${c.tipo}</div>
        </div>
        <div class="conta-saldo">${formatCurrency(c.saldo_atual)}</div>
        <div class="conta-actions">
          <button class="btn-icon" data-id="${c.id}" onclick="openEdit(${c.id}, '${c.nome.replace(/'/g,"\\'")}', '${c.tipo}', ${c.saldo_atual})" title="Editar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="btn-icon danger" onclick="deleteConta(${c.id})" title="Excluir">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>`;
    }

    async function loadContas() {
      const data = await apiGet('/api/contas');
      if (!data) return;
      listEl.innerHTML = data.length
        ? data.map(renderCard).join('')
        : '<div class="empty-state">Nenhuma conta encontrada.</div>';
    }

    function openModal() { modalOverlay.classList.add('open'); }
    function closeModal() {
      modalOverlay.classList.remove('open');
      contaIdInput.value = '';
      contaNome.value = '';
      contaTipo.value = 'dinheiro';
      contaSaldo.value = '';
    }

    window.openEdit = function(id, nome, tipo, saldo) {
      modalTitle.textContent = 'Editar Conta';
      contaIdInput.value = id;
      contaNome.value = nome;
      contaTipo.value = tipo;
      contaSaldo.value = saldo;
      openModal();
    };

    document.getElementById('fabAdd').addEventListener('click', function() {
      modalTitle.textContent = 'Nova Conta';
      openModal();
    });

    document.getElementById('btnCancel').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });

    document.getElementById('btnSave').addEventListener('click', async function() {
      const id = contaIdInput.value;
      const body = {
        nome: contaNome.value.trim(),
        tipo: contaTipo.value,
        saldo_inicial: parseFloat(contaSaldo.value) || 0
      };

      if (!body.nome) { alert('Informe o nome da conta.'); return; }

      if (id) {
        await apiPut('/api/contas/' + id, body);
      } else {
        await apiPost('/api/contas', body);
      }

      closeModal();
      loadContas();
    });

    window.deleteConta = async function(id) {
      if (!confirm('Excluir esta conta?')) return;
      await apiDelete('/api/contas/' + id);
      loadContas();
    };

    loadContas();
  </script>
  <nav class="tab-bar">
    <a href="/dashboard" class="tab-item"><div class="tab-icon">🏠</div><span>Dashboard</span></a>
    <a href="/fechamento" class="tab-item"><div class="tab-icon">📊</div><span>Fechamento</span></a>
    <a href="/churrasco" class="tab-item"><div class="tab-icon">🥩</div><span>Churrasco</span></a>
    <a href="/lancamentos" class="tab-item"><div class="tab-icon">📋</div><span>Lançamentos</span></a>
    <a href="/contas-a-pagar" class="tab-item"><div class="tab-icon">📅</div><span>A Pagar</span></a>
  </nav>
</body>
</html>
